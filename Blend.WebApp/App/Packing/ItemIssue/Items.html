<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

    <button type="button" class="btn btn-default" ng-disabled="true"> <span class="badge">Issue Note : {{selectedItem.IssueNoteNo}} Blend : {{selectedItem.BlendNo}}</span></button>

</div>

<div class="modal-body">
    <div ng-show="message" class="{{messageclass}}" role="alert">
        <label>{{message}}</label>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>
    <div class="table-responsive">
        <div class="text-left">
            <p>List of stock Items : {{stockitems.length}} </p>

        </div>
        <div class="input-group">
            <span class="input-group-addon"><i class="glyphicon glyphicon-search"></i></span>
            <input placeholder="Search Stock Items" style="width: 200px" id="search" type="text" class="form-control" ng-model="searchstr" ng-change="searchdata()" />
            <span class="glyphicon glyphicon-refresh glyphicon-refresh-animate" style="margin-top:7px;margin-left:10px" ng-show="loadingdata"></span>
            
        </div>
        
        <table class="table" style="width: 100%; font-size: smaller;margin-top:20px">

            <thead>
                <tr>
                    <th ng-repeat="c in itemcolumns" style="font: small" ng-hide="{{c.hide}}">{{c.text}}</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="c in stockitems" ng-animate=" 'animate'" style="font: small" ng-include="getTemplate(c)"></tr>
            </tbody>
        </table>
        <script type="text/ng-template" id="display">
            <td width="5%" ng-hide="true">{{c.Id}}</td>
            <td width="5%">{{c.ItemCode}}</td>
            <td width="10%">{{c.ItemName}}</td>
            <td width="25%">{{c.ShortDescription}}</td>
            <td width="10%">{{c.UomName}}</td>
            <td width="10%">{{c.Qty | number: 2}}</td>
            <td width="10%">{{c.Price | number: 2}}</td>
            <td width="10%">{{c.ReceivedDate}}</td>
            <td width="20%">
                <button class="btn btn-primary btn-sm" ng-click="changeitem(c)" ng-disabled="IsAdded(c)">+</button>
            </td>
        </script>
        <script type="text/ng-template" id="edit">
            <td width="5%" ng-hide="true">{{c.Id}}</td>
            <td width="5%">{{c.ItemCode}}</td>
            <td width="10%">{{c.ItemName}}</td>
            <td width="25%">{{c.ShortDescription}}</td>
            <td width="10%">{{c.UomName}}</td>
            <td width="10%"><input id="{{c.Id}}" type="text" ng-model="c.Qty" only-digits style="width:75px" class="form-control" /></td>
            <td width="10%">{{c.Price | number: 2}}</td>
            <td width="10%">{{c.ReceivedDate}}</td>
            <td width="20%">
                <button class="btn btn-primary btn-sm" ng-click="additem(c)">Add</button>
                <button class="btn btn-danger btn-sm" ng-click="reset()">Cancel</button>
            </td>
        </script>
    </div>
</div>
<div class="modal-footer">
    <div class="text-right">
        <a class="btn btn-danger btn-sm" ng-click="cancel()">Back to Issue Note</a>
    </div>
</div>
