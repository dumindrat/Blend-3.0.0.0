<div class="modal-header">
    <div>

        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>
        <h4>Return Note Item</h4>
    </div>
</div>
<div class="modal-body">

    <div ng-show="message" class="{{messageclass}}" role="alert">
        <label>{{message}}</label>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>

    <div class="form-group">
        <label for="contract">Return Item Qty : {{selectedItem.ItemCode}} - ({{selectedItem.StockQty}})</label>
        <input type="text" id="returnqty" class="form-control" ng-model="New.ReturnQty" ng-hide="false" only-digits />
    </div>
    <div class="form-group">
        <label for="contract">Reason</label>
        <input type="text" id="reason" class="form-control" ng-model="New.Reason" ng-hide="false" />

    </div>
</div>
<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <span style="margin-left: 8px;" ng-show="disablestatus">
            <img class="savedata" />
        </span>
        <button id="btnSave" class="btn btn-primary btn-sm" ng-click="additem();" ng-disabled="button.disabled">Add to Return</button>
        <button class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="button.disabled">Close</button>

    </div>
</div>
