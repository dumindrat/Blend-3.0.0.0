<div class="modal-header">
    <div>

        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>
        <h4>Email History</h4>
    </div>
</div>
<div class="modal-body">
    <div class="table-container">
        <table class="table table-filter">

            <tbody>

                <tr ng-repeat="c in emaildata"data-status="pagado">

                    <td style="width: 75%">

                        <div class="media">
                            <div class="media-body" style="width: 100%">

                                <h4 class="title">
                                    Sent to: {{c.ToAddress}}
                                </h4>
                               <!-- <p class="summary">Supplier : {{c.Supplier}}  |  Contract : {{c.ContractNumber}} </p>-->
                                <p class="summary">Delivery on : {{c.AddedDate}} By :{{c.User}}. Subject : {{c.Subject}}</p>
                                <p class="summary">Attachment : {{c.AttachmentPath}}</p>
                            </div>
                        </div>
                    </td>


                </tr>
            </tbody>
        </table>
    </div>

</div>
<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <button class="btn btn-danger btn-sm" ng-click="cancel();">Close</button>

    </div>
</div>
