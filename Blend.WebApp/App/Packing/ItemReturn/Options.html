<div class="modal-header">
    <div>

        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>
        <h4>Options</h4>
    </div>
</div>
<div class="modal-body">
    <div class="form-group">
        <button id="btnSave" class="btn btn-default btn-sm" ng-click="email();" type="submit" style="width:100%">Supplier Email </button>
    </div>
    <div class="form-group">
        <button class="btn btn-default btn-sm" ng-click="print();" style="width:100%">Print</button>
    </div>
    <div class="form-group">
        <button class="btn btn-default btn-sm" ng-click="settlepayment(Email);" style="width:100%">Settile Payment</button>
    </div>
</div>

<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <button class="btn btn-danger btn-sm" ng-click="cancel();">Close</button>
    </div>
</div>
