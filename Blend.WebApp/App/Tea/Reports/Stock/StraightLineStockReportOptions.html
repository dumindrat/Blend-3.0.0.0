<div class="modal-header modal-header-info">
    <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

    <h4 class="modal-title">Print Options - {{ReportName}}</h4>
</div>
<div class="modal-body">
    <ul class="list-group">
        <li class="list-group-item">
            <div class="form-group" style="text-align: left">
                <label for="grade">Filter by Grade:</label>
                <input type="text" class="form-control" ng-model="New.Grade" id="grade" style="width: 50%" />
            </div>

        </li>

        <li class="list-group-item">
            <div class="form-group" style="text-align: left">
                <label for="standard">Filter by Standard:</label>
                <input type="text" class="form-control" ng-model="New.Standard" id="standard" style="width: 50%" />
            </div>

        </li>
        <li class="list-group-item" ng-hide="hideallocation">Available Lines Only
                       
                    <div class="material-switch pull-right">
                        <input id="Checkbox2" name="someSwitchOption001" type="checkbox" ng-value="New.IsAvailableLineOnly" ng-model="New.IsAvailableLineOnly" ng-change="settype_availableonly(New.IsAvailableLineOnly)" />
                        <label for="optallocatedlines" class="label-info"></label>
                    </div>
        </li>
        <li class="list-group-item" ng-hide="hideallocation">Available & Allocated Lines together
                       
                    <div class="material-switch pull-right">
                        <input id="optallocatedlines" name="someSwitchOption001" type="checkbox" ng-value="New.IsWithAllocatedLine" ng-model="New.IsWithAllocatedLine" ng-change="settype_withallocate(New.IsWithAllocatedLine)"/>
                        <label for="optallocatedlines" class="label-info"></label>
                    </div>
        </li>
        <li class="list-group-item">Allocated Lines Only
                       
                    <div class="material-switch pull-right">
                        <input id="Checkbox1" name="someSwitchOption001" type="checkbox" ng-value="New.IsAllocatedLineOnly" ng-model="New.IsAllocatedLineOnly" ng-change="settype_allocateonly(New.IsAllocatedLineOnly)"/>
                        <label for="optallocatedlines" class="label-info"></label>
                    </div>
        </li>
        <li class="list-group-item">With Values
                    <div class="material-switch pull-right">
                        <input id="optunallocatedlines" name="someSwitchOption003" type="checkbox" ng-value="New.IsWithValues" ng-model="New.IsWithValues" />
                        <label for="optunallocatedlines" class="label-info"></label>
                    </div>
        </li>
        <li class="list-group-item">Download as Excel
                       
                    <div class="material-switch pull-right">
                        <input id="optexcel" name="someSwitchOption002" type="checkbox" ng-value="New.IsExcelFormat" ng-model="New.IsExcelFormat" />
                        <label for="optexcel" class="label-info"></label>
                    </div>
        </li>
    </ul>

    <div class="form-group">
        <input type="button" name="sl" id="btn" class="btn btn-info" value="Print" ng-click="printlines()" style="width: 100%" />
    </div>

</div>
<div class="modal-footer">
    <button type="button" class="btn btn-danger" ng-click="cancel()">Cancel</button>
</div>
