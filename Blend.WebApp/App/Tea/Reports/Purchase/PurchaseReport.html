

<div>
    <h4>Print Purchase Reports {{recordCount}}</h4>
</div>

<div class="input-group">
    <span class="input-group-addon"><i class="glyphicon glyphicon-search"></i></span>
    <input placeholder="Search Sale" style="width: 200px" id="datasearch" type="text" class="form-control" ng-model="searchstr" ng-change="searchdata()" />
    <span class="input-group-btn">
        <button class="btn btn-info btn-sm" ng-click="MoreOptions();">Advance Filter options</button>

    </span>
    <span class="input-group-btn">
        <button class="btn btn-info btn-sm" ng-click="BrokerPurchases();">Broker Wise Purchases</button>

    </span>
</div>
<br />
<div class="panel panel-default">
    <div class="panel-body" style="height: 100%">
        <div class="table-container">
            <table class="table table-filter">

                <tbody>

                    <tr ng-repeat="c in SaleData" id="{{c.SaleId}}" data-status="pagado">

                        <td style="width: 65%"  ng-disabled="accessLevels.C || CheckCloseStatus(c)">

                            <div class="media">
                                <div class="media-body" style="width: 100%">
                                    <span class="media-meta pull-right">Last Modified : {{c.ModifiedDate}} By {{c.ModifiedUser}}</span>

                                    <h4 class="title">Sale Date : {{c.SaleDate}}
                                       
                                    </h4>
                                    <p class="summary" >{{c.SaleStatus}}  </p>
                                </div>
                            </div>
                        </td>
                        <td style="width: 35%">
                            <div class="btn-group">
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.C" ng-click="SaleSummaryPrintOption(c.SaleId)" data-toggle="tooltip" data-placement="top" title="Print Sale Summary">Sale Summary</button>
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.C" ng-click="PrintOption(c)" data-toggle="tooltip" data-placement="top" title="Print Purchase Sheet">Purchase Sheet</button>
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.C" ng-click="printCanisterSheet(c.SaleId)" data-toggle="tooltip" data-placement="top" title="Print Canister Sheet">Canister Sheet</button>
                            </div>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
