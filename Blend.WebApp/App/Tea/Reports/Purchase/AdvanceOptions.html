<div class="modal-header modal-header-info">
    <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

    <h4 class="modal-title">Print Options</h4>
</div>
<div class="modal-body">
    <ul class="list-group">
        <li class="list-group-item">Sale Date range
                       
                
            <form class="form-inline" style="margin-top: 10px">
                <div class="form-group" style="text-align: left">
                    <label for="fromdate">From Sale Date:</label>
                    <input type="date" class="form-control" ng-value="New.FromSaleDate" ng-model="New.FromSaleDate" id="fromdate" style="width: 30%" placeholder="MM-DD-YYYY" />

                    <label for="todate">To Sale Date:</label>
                    <input type="date" class="form-control" ng-value="New.ToSaleDate" ng-model="New.ToSaleDate" id="todate" style="width: 30%" placeholder="MM-DD-YYYY" />

                </div>
            </form>
        </li>
        <li class="list-group-item">
            <div class="form-group" style="text-align: left">
                <label for="grade">Filter by Grade:</label>
                <input type="text" class="form-control" ng-model="New.Grade" id="grade" style="width: 50%" />
            </div>

        </li>

        <li class="list-group-item">
            <div class="form-group" style="text-align: left">
                <label for="standard">Filter by Standard:</label>
                <input type="text" class="form-control" ng-model="New.Standard" id="standard" style="width: 50%" />
            </div>

        </li>
        <li class="list-group-item">
            <div class="form-group" style="text-align: left">
                <label for="st">Filter by Sale Type:</label>
                <input type="text" class="form-control" ng-model="New.SaleType" id="st" style="width: 50%" />
            </div>

        </li>
        <li class="list-group-item">
            <div class="form-group" style="text-align: left">
                <label for="bk">Filter by Broker Code:</label>
                <input type="text" class="form-control" ng-model="New.BrokerCode" id="bk" style="width: 50%" />
            </div>

        </li>
        <li class="list-group-item">With Values
                    <div class="material-switch pull-right">
                        <input id="optallocatedlines" name="someSwitchOption001" type="checkbox" ng-value="New.IsWithValues" ng-model="New.IsWithValues" />
                        <label for="optallocatedlines" class="label-info"></label>
                    </div>
        </li>
        <li class="list-group-item">Download as Excel
            <div class="material-switch pull-right">
                <input id="optexcel" name="someSwitchOption002" type="checkbox" ng-value="New.IsExcelFormat" ng-model="New.IsExcelFormat" />
                <label for="optexcel" class="label-info"></label>
            </div>

        </li>
    </ul>

</div>
<div class="modal-footer modal-footer-primary">

    <div class="form-group">
        <input type="button" name="sl" id="btn" class="btn btn-info btn-sm" value="Print" ng-click="printlines()" />

        <button type="button" class="btn btn-danger btn-sm" ng-click="cancel()">Cancel</button>
    </div>

</div>
