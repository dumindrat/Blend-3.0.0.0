<div class="modal-header">
    <div>
        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

        <h3>{{buttonstatus}} Sale</h3>
    </div>
</div>
<div class="modal-body">

    <div ng-show="message" class="{{messageclass}}" role="alert">
        <label>{{message}}</label>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>
    <div class="form-group">
        <label for="buyername">Sale Date:</label>
        <input type="date" class="form-control" ng-value="New.SaleDate" ng-model="New.SaleDate" id="saledate" style="width: 100%" placeholder="MM-DD-YYYY" required autofocus />
    </div>
</div>
<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <span style="margin-left: 8px;" ng-show="dataLoading">
            <img class="savedata" />
        </span>
        <button id="btnSave" class="btn btn-primary btn-sm" ng-click="create();" type="submit" ng-disabled="dataLoading">{{buttonstatus}}</button>
        <button class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="dataLoading">Cancel</button>

    </div>
</div>
