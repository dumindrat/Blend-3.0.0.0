<div class="input-group">
    <span class="input-group-addon"><i class="glyphicon glyphicon-search"></i></span>
    <input placeholder="Search Sale" style="width: 200px" id="search" type="text" class="form-control" ng-model="searchstr" ng-change="searchdata()" />
    <span class="input-group-btn">
        <button class="btn btn-info btn-sm" ng-click="openCreateSaleWindow();">Create New</button>

    </span>
</div>
<br />
<div class="panel panel-default">
    <div class="panel-body" style="height: 100%">
        <div class="table-container">
            <table class="table table-filter">

                <tbody>

                    <tr ng-repeat="c in SaleData" id="{{c.SaleId}}" data-status="pagado">

                        <td style="width: 80%" ng-click="openCreateSaleWindow(c)" ng-disabled="accessLevels.C || CheckCloseStatus(c)">

                            <div class="media">
                                <div class="media-body" style="width: 100%">
                                    <span class="media-meta pull-right">Last Modified : {{c.ModifiedDate}} By {{c.ModifiedUser}}</span>

                                    <h4 class="title">{{c.SaleDate}}
                                       
                                    </h4>
                                    <p class="summary" ng-hide="accessLevels.C">{{c.SaleStatus}}  </p>
                                </div>
                            </div>
                        </td>
                        <td style="width: 20%">
                            <div class="btn-group">
                                <button type="button" class="btn btn-default btn-sm" ng-click="openCreateSaleWindow(c)" ng-disabled="accessLevels.C || CheckCloseStatus(c)" data-toggle="tooltip" data-placement="top" title="Edit Sale Date">Edit</button>
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.M" ng-click="openViewAddedLines(c)" data-toggle="tooltip" data-placement="top" title="Add and Remove lines">Lines</button>
                                <input type="button" ng-class="SetClass(c)" ng-click="ChangeStatus(c)"  name="clsoe"  ng-value="CheckStatus(c)">
                            </div>
                        </td>
                       
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
