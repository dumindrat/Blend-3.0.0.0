<style type="text/css">
    .div-table
    {
        display: table;
        width: auto;
        /*border: 1px solid #666666;*/
        border-spacing: 5px; /* cellspacing:poor IE support for  this */
    }

    .div-table-row
    {
        display: table-row;
        width: auto;
        clear: both;
        margin: 4px;
        text-align: center;
    }

    .div-table-input-col
    {
        float: left; /* fix for  buggy browsers */
        display: table-column;
        width: 100px;
        margin: 4px;
        text-align: right;
    }

    .div-table-lable-col
    {
        float: left; /* fix for  buggy browsers */
        display: table-column;
        width: 120px;
        margin: 4px;
        text-align: right;
    }

    #saletype
    {
        width: 109px;
    }

    #i1, #i2, #i3, #i4, #i5, #i6, #i7, #i8, #i9, #i10, #i11, #i12, #i13, #i14, #i15
    {
        text-align: left;
        margin: 2px;
    }

    #salecode, #lotno, #invoiceno, #grade, #standard, #net1, #packs1, #net2, #packs2, #reducedqty, #rate
    {
        width: 100px;
    }
</style>


<div class="modal-body">
   
   
    <form name="straightline_form" class="form-horizontal" data-toggle="validator" role="form" ng-submit="AddToSale(New)">

        <div class="table-responsive">
            <div class="panel panel-primary" style="width: 100%">
                <div class="panel-heading">
                    <button type="button" class="btn btn-primary">Reserved No <span class="badge">{{reservedNo}} {{buttonstatus}}</span></button>
                    <button type="button" class="btn btn-primary" ng-hide="true">Version <span class="badge">{{New.RowVersion}}</span></button>

                </div>
                <div ng-show="message" class="{{messageclass}}" role="alert">
                    <label>{{message}}</label>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>

                <div class="panel-body">


                    <div class="div-table  " style="text-align: center">

                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Sale Type</label>
                            </div>
                            <div class="div-table-input-col" id="i1">
                                <input type="text" id="Text1" class="form-control" ng-model="New.Id" ng-hide="true" />
                                <input type="text" id="repeatId" class="form-control" ng-model="New.RepeatingId" ng-hide="true" />

                                <input type="text" id="rowversion1" class="form-control" ng-model="New.RowVersion1" ng-hide="true" />
                                <input type="text" id="rowversion2" class="form-control" ng-model="New.RowVersion2" ng-hide="true" />

                                <input type="text" id="stockid" class="form-control" ng-model="New.StockId" ng-hide="true" />
                                <input type="text" id="Text2" class="form-control" ng-model="New.RepeatingStockId" ng-hide="true" />


                                <select autofocus id="saletype" name="D1" class="form-control" ng-options="s.saletype as s.saletype for s in saletypes" ng-model="New.SaleType" required>
                                    <option style="display: none" value="">---Select---</option>
                                </select>
                            </div>
                            <div class="div-table-lable-col">
                                <label>Sale Code</label>
                            </div>
                            <div class="div-table-input-col" id="i2">
                                <input id="salecode" class="form-control" ng-model="New.SaleCode" required />
                            </div>


                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>LotNo</label>
                            </div>
                            <div class="div-table-input-col" id="i3">
                                <input type="text" id="lotno" class="form-control" ng-model="New.LotNo" required />
                            </div>
                            <div class="div-table-lable-col">
                                <label>Invoice</label>
                            </div>
                            <div class="div-table-input-col" id="i4">
                                <input type="text" id="invoiceno" class="form-control" ng-model="New.Invoice" required />
                            </div>
                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Broker</label>
                            </div>
                            <div class="div-table-input-col" id="i5">
                                <select style="width: 400px" ng-options="broker.BrokerId as broker.BrokerName for broker  in BrokerData" class="form-control" ng-model="New.BrokerId" required>
                                    <option style="display: none" value="">---Select---</option>
                                </select>

                            </div>
                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Gardenmark</label>
                            </div>
                            <div class="div-table-input-col" id="Div1">
                                <input type="text" style="width: 400px" id="gardenmark" class="form-control" data-ng-model="New.GardenMark" list="gardenmarks" required />
                            </div>
                            <datalist id="gardenmarks">
                                <option data-ng-repeat="mark in GardenMarkList" value="{{mark}}">
                            </datalist>
                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Grade </label>
                            </div>
                            <div class="div-table-input-col" id="i6">
                                <input type="text" id="grade" class="form-control" ng-model="New.Grade" list="grades" required />
                            </div>
                            <datalist id="grades">
                                <option data-ng-repeat="grade in GradeList" value="{{grade}}">
                            </datalist>
                            <div class="div-table-lable-col">
                                <label>Standard</label>
                            </div>
                            <div class="div-table-input-col" id="i7">
                                <input type="text" id="standard" class="form-control" ng-model="New.Standard" />
                            </div>
                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Packs</label>
                            </div>
                            <div class="div-table-input-col" id="i9">
                                <input type="text" id="packs1" class="form-control" ng-model="New.Pack1" ng-change="calWeight()" valid-number required />
                            </div>
                            <div class="div-table-lable-col">
                                <label>Net </label>
                            </div>
                            <div class="div-table-input-col" id="i8">
                                <input id="net1" name="net1" class="form-control" ng-model="New.Net1" ng-change="calWeight()" only-digits required />
                                <span ng-show="straightline_form.net1.$error.required" class="help-block">Net is required</span>
                            </div>

                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Packs</label>
                            </div>
                            <div class="div-table-input-col" id="i11">
                                <input type="text" id="packs2" class="form-control" ng-model="New.Pack2" ng-change="calWeight()" valid-number required />
                            </div>
                            <div class="div-table-lable-col">
                                <label>Net</label>
                            </div>
                            <div class="div-table-input-col" id="i10">
                                <input type="text" id="net2" class="form-control" ng-model="New.Net2" ng-change="calWeight()" only-digits required />
                            </div>

                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Reduced Qty</label>
                            </div>
                            <div class="div-table-input-col" id="i12">
                                <input type="text" id="reducedqty" class="form-control" ng-model="New.ReducedQty" ng-change="calWeight()" validnumber required />
                            </div>
                            <div class="div-table-lable-col">
                                <label>Rate</label>
                            </div>
                            <div class="div-table-input-col" id="i13">
                                <input type="text" id="rate" class="form-control" ng-model="New.Rate" ng-change="calWeight()" only-digits required />
                            </div>
                        </div>
                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <label>Weight</label>
                            </div>
                            <div class="div-table-input-col" id="i14">
                                <input type="text" id="weight" class="form-control" ng-model="New.Weight" ng-disabled="true" only-digits />
                            </div>
                            <div class="div-table-lable-col">
                                <label>Value</label>
                            </div>
                            <div class="div-table-input-col" id="i15">
                                <input type="text" id="value" class="form-control" ng-model="New.Value" ng-disabled="true" />
                            </div>

                        </div>

                        <div class="div-table-row">
                            <div class="div-table-lable-col">
                                <input type="button" class="btn btn-warning btn-sm" ng-click="openAddCertificateWindow(teaCertificates)" ng-disabled="dataLoading" value="Add Certifications" />
                            </div>
                            <div class="div-table-input-col" id="Div2">
                                {{New.TeaCertificates}}
                            </div>
                        </div>


                    </div>

                </div>
                <div class="panel-footer">
                    <div class="text-right">
                        <span style="margin-left: 8px;" ng-show="dataLoading">
                            <img class="savedata" />
                        </span>
                        <button id="Button1" type="submit" class="btn btn-primary btn-sm" type="submit" ng-disabled="dataLoading">{{buttonStatus}}</button>
                        <input type="button" class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="dataLoading" value="Cancel" />

                    </div>
                </div>
            </div>

        </div>
    </form>
</div>
