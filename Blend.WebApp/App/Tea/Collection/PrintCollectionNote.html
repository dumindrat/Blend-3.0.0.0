<div class="modal-header">
    <div>
        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

        
    </div>
</div>
<div class="modal-body">

    <div ng-show="message" class="{{messageclass}}" role="alert">
        <label>{{message}}</label>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    
    </div>
   <div>
       <ul class="list-group">
           <li class="list-group-item">Search Collection No
                <div class="div-table-input-col" id="Div1">
                    <input type="text" style="width: 100%" id="collectionnote" class="form-control"  data-ng-model="SelectedCollectioNoteNo" list="collectionnotelist" required />
                </div>
            <datalist id="collectionnotelist">
                <option data-ng-repeat="note in CollectionNotes" value="{{note}}">
            </datalist>
        </li>
            <li class="list-group-item">Download as Excel
                       
                    <div class="material-switch pull-right">
                        <input id="optexcel" name="someSwitchOption002" type="checkbox" ng-value="IsExcelFormat" ng-model="IsExcelFormat" />
                        <label for="optexcel" class="label-info"></label>
                    </div>
        </li>
       </ul>
   </div>
</div>
<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <span style="margin-left: 8px;" ng-show="dataLoading">
            <img class="savedata" />
        </span>
        <button id="btnSave" class="btn btn-primary btn-sm" ng-click="print();" type="submit" ng-disabled="dataLoading">Print</button>
        <button class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="dataLoading">Cancel</button>

    </div>
</div>
