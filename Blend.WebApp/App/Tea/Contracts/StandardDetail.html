<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

    <button type="button" class="btn btn-warning">Selected Contract : <span class="badge">{{selectedContract.ContractName}}</span></button>

</div>
<div class="modal-body">
    <div ng-show="message" class="{{messageclass}}" role="alert">
        <label>{{message}}</label>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>
    <div class="table-responsive" ng-show="setvisibleaddedstandard">
        <form name="contract_form" class="form-horizontal" role="form" novalidate>
            <form-element label="">
                <div class="text-left">
                    <a class="btn btn-primary" ng-click="setHideAddedStandard();">Add Standard</a>
                </div>
                <br />
             </form-element>

            <div class="panel panel-primary">
                <div class="panel-heading">
                    List of added Tea Standards
                </div>
                <div class="panel-body">

                    <table class="table table-striped table-bordered">
                        <div ng-show="addedStandardData.length==0">
                            <i class="fa fa-ban fa-3x"></i>&nbsp;No data found
                        </div>
                        <div ng-hide="addedStandardData.length>-1">
                            <i class="fa fa-cog fa-3x fa-spin"></i>&nbsp;Loading
                        </div>
                        <tbody>
                            <tr>
                                <th ng-hide="{{c.hide}}" ng-repeat="c in addedteastandardscolumns">{{c.text}}</th>
                            </tr>

                            <tr ng-repeat="c in addedStandardData  | filter:filterteastandard | orderBy:'-ContractId'" id="{{c.ContractId}}" animate-on-change='c.StandardName' ng-animate=" 'animate'" ng-include="getUpdateTemplate(c)">

                                <script type="text/ng-template" id="displayAddedTemplate">
                                <td ng-hide="true" width="5%">{{c.ContractId}}</td>
                                <td ng-hide="true" width="5%">{{c.StandardId}}</td>
                                <td width="55%">{{c.StandardName}}</td>
                                <td width="30%" >{{c.OrderQty}}</td>
                                <td ng-hide="true" width="15%">{{c.RowVersion}}</td>
                                <td width="15%">
                                    <div class="btn-group">
                                      <a  class="btn btn-info btn-sm"  ng-click="editAddedStandard(c);">Update</a>
                                    </div>
                                </td>
                                </script>
                                <script type="text/ng-template" id="displayUpdateTemplate">
                                <td style="width: 5%" ng-hide="true" ng-model=c.ContractId>{{c.ContractId}}</td>
                                <td style="width: 5%" ng-hide="true" ng-model=c.StandardId>{{c.StandardId}}</td>
                                <td style="width: 55%" ng-model=c.StandardName>{{c.StandardName}}</td>
                                <td style="width: 25%" ><input style="width: 100%" type="text" ng-model=c.OrderQty only-digits /></td>
                                <td style="width: 15%" ng-hide="true" ng-model=c.RowVersion>{{c.RowVersion}}</td>
                                <td style="width: 20%">
                                    <button type="button" class="btn btn-default btn-sm" ng-click="updateContractDet(c)">
                                         <span class="glyphicon glyphicon-ok"></span> 
                                    </button>
                                    <button type="button" class="btn btn-default btn-sm" ng-click="resetUpdate(c)">
                                         <span class="glyphicon glyphicon-remove"></span> 
                                    </button>
                                </td>
                                </script>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <form name="contract_form" class="form-horizontal" role="form" novalidate>
                    <div class="space"></div>
                    <div class="panel-footer">
                        <form-element label="">
                            <div class="text-right">
                                <a class="btn btn-danger btn-sm" ng-click="cancel()">Cancel</a>
                            </div>
                        </form-element>
                    </div>
                </form>
            </div>

        </form>
    </div>

    <div class="table-responsive" ng-show="setvisiblestandard">
        <div class="panel panel-primary">


            <div class="panel-heading">
                <div>
                    <input id="searchavailablestd" autofocus type="text" style="width: 300px" class="form-control" ng-model="searchstr" placeholder="Search Available Standard" id="search" ng-change="searchdata()" />
                </div>
            </div>
            <div class="panel-body panel-scroll">
                <div>
                    <i class="fa fa-ban fa-3x"></i>&nbsp;{{teastandards.length.toString()}} Record(s) found
                    <span style="margin-left: 8px;" ng-show="dataloading">
                        <img class="savedata" />
                    </span>
                </div>

                <table class="table table-striped table-bordered">


                    <tbody>
                        <tr>
                            <th ng-repeat="c in teastandardscolumns">{{c.text}}</th>
                        </tr>

                        <tr ng-repeat="c in teastandards | filter:filterteastandard | orderBy:'-StandardId'" id="{{c.StandardId}}" animate-on-change='c.StandardName' ng-animate=" 'animate'" ng-include="getTemplate(c)">
                            <script type="text/ng-template" id="display">
                                <td width="5%">{{c.StandardId}}</td>
                                <td width="55%">{{c.StandardName}}</td>
                                <td width="10%">{{c.OrderQty}}</td>
                                <td width="25%">
                                    <div class="btn-group">
                                      <a  class="btn btn-info btn-sm"  ng-click="editStandard(c);">Add to Contract</a>
                                    </div>
                                </td>
                            </script>

                            <script type="text/ng-template" id="edit">
                                <td width="5%" ng-model=c.StandardId>{{c.StandardId}}</td>
                                <td width="55%" ng-model=c.StandardName>{{c.StandardName}}</td>
                                <td width="15%"><input type="text" ng-model=c.OrderQty only-digits/></td>
                                <td width="20%">
                                    <button type="button" class="btn btn-default btn-sm" ng-click="addToContract(c)">
                                         <span class="glyphicon glyphicon-ok"></span> 
                                    </button>
                                    <button type="button" class="btn btn-default btn-sm" ng-click="reset(c)">
                                         <span class="glyphicon glyphicon-remove"></span> 
                                    </button>
                                </td>
                            </script>
                        </tr>
                    </tbody>
                </table>
            </div>
            <form name="contract_form" class="form-horizontal" role="form" novalidate>
                <div class="space"></div>
                <div class="space-4"></div>
                <div class="panel-footer">
                    <form-element label="">
                    <div class="text-right">
                        <a class="btn btn-danger btn-sm" ng-click="setVisibleAddedStandard()">Cancel</a>
                    </div>
                </form-element>
                </div>
            </form>
        </div>
    </div>

</div>
