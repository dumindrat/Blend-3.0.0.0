<div>
    <h4>Blend Information {{recordCount}}</h4>
</div>


<div class="input-group">
    <span class="input-group-addon"><i class="glyphicon glyphicon-search"></i></span>
    <input placeholder="Search Blends" style="width: 200px" id="datasearch" type="text" class="form-control" ng-model="searchstr" ng-change="searchblend()" />
    <span class="input-group-btn"></span>
</div>
<br />

<div class="panel panel-default">
    <div class="panel-body" style="height: 100%">
        <div class="table-container">
            <table class="table table-filter">

                <tbody>

                    <tr ng-repeat="c in BlendData" id="{{c.Id}}" data-status="pagado">

                        <td style="width: 75%" ng-click="openCreateWindow(c)">

                            <div class="media">
                                <div class="media-body" style="width: 100%">
                                    <!--<span class="media-meta pull-right">Last Modified : {{c.ModifiedDate}}</span>-->

                                    <h4 class="title">{{c.BlendNo}}
                                    </h4>
                                    <p class="summary">Contract : {{c.ContractNo}}  </p>
                                    <p class="summary">Standard : {{c.StandardName}}  </p>
                                    <p class="summary">Export Qty : {{c.ExportQty}} | Line Qty : {{c.LineQty}}  | Status: {{c.CloseStatus}} | Request Cancel: {{c.IsCancelRequest}}</p>
                                </div>
                            </div>
                        </td>

                        <td style="width: 25%">
                            <div class="btn-group">
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.C || CheckCloseStatus(c)" ng-click="openCloseView(c)">Close</button>
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.C || !CheckCloseStatus(c)" ng-click="CancelConfirm(c)">Cancel</button>
                                <button type="button" class="btn btn-default btn-sm" ng-disabled="accessLevels.C || !CheckCloseStatus(c)" ng-click="openMoreOptionsView(c)">Options</button>
                            </div>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
