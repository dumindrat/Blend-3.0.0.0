<div class="modal-header">
    <div>
        <h3>Add Remain Qty</h3>
    </div>
</div>
<div class="modal-body">
    <div ng-show="message" class="{{messageclass}}" role="alert">
        <label>{{message}}</label>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>
    <div class="form-group">
        <label for="buyername">Remain Blend Qty:</label>
        <input type="text" class="form-control" ng-value="New.FinalBlendQty" ng-model="New.FinalBlendQty" style="width: 100%" id="remainqty" only-digits />
    </div>
</div>
<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <button id="btnSave" class="btn btn-primary" ng-click="add();" type="submit">Ok</button>
        <button class="btn btn-danger" ng-click="cancel();" ng-disabled="dataLoading">Cancel</button>

    </div>
</div>
