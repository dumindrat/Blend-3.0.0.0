<div class="modal-header">
    <div>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close" ng-click="cancel()"><span aria-hidden="true">&times;</span></button>
        <h4>Blend Close Options : {{SelectedBlend.BlendNo}}</h4>

    </div>
</div>
<div class="modal-body">
    <div>
        <div class="form-group">

            <input type="button" class="btn btn-warning btn-sm" value="Convert rate to : {{Blend.ConvertRate}}" ng-hide="sethide(Blend)" ng-click="convert(Blend)" />
            <!--<input type="button" class="btn btn-warning btn-sm" value="Go To Shipment" ng-disabled="checkShipmentRights()" ng-click="openShipmentWindow(BlendShipmentData)" />-->

        </div>
    </div>
    <br />
    <fieldset class="the-fieldset">
        <legend class="the-legend">Summary</legend>
        <div class="container-fluid">

            <table class="table table-hover" style="width: 100%; font-size: small; font-style: inherit">
                <thead>
                    <tr>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="c in BlendInfo" id="{{c.Item}}" animate-on-change='c.Item' ng-animate=" 'animate'" style="font: small">
                        <td>{{c.Item}}</td>
                        <td style="font-style: italic"><b>{{c.Value}}</b></td>
                    </tr>

                </tbody>
            </table>
        </div>
        <span style="margin-left: 8px;" ng-show="showLoader">
            <img class="savedata" />
        </span>
    </fieldset>
</div>
<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <button class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="dataLoading">Close</button>

    </div>
</div>
