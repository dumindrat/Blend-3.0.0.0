<div class="modal-header">
    <div>
        <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>
        <h4>Download Options : {{SelectedBlend.BlendNo}}</h4>
    </div>
</div>

<div class="modal-body">


    <table class="table" style="width: 100%; font-size: smaller">

        <thead>
            <tr>
                <th style="width: 75%">File Type</th>
                <th style="width: 25%"></th>

            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="width: 75%">StraighLines & BlendBalances in Excel format</td>
                <td style="width: 25%">
                    <button type="button" class="btn btn-default btn-sm" ng-click="download('GetExcelData')">
                        <span class="glyphicon glyphicon-download-alt"></span> Download
                    </button>
                </td>
            </tr>
            <tr>
                <td style="width: 75%">StraighLines in Text format</td>
                <td style="width: 50%">
                    <button type="button" class="btn btn-default btn-sm" ng-click="download('GetSLTextData')">
                        <span class="glyphicon glyphicon-download-alt"></span> Download
                    </button>
                </td>
            </tr>
            <tr>
                <td style="width: 50%">BlendBalances in Text format</td>
                <td style="width: 50%">
                    <button type="button" class="btn btn-default btn-sm" ng-click="download('GetBLTextData')">
                        <span class="glyphicon glyphicon-download-alt"></span> Download
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

</div>
<div class="panel-footer">
    <div class="text-right">
        <input type="button" id="btnBLCancel" value="Close" class="btn btn-danger btn-sm" ng-disabled="showLoader" ng-click="cancel();" />

    </div>
</div>
