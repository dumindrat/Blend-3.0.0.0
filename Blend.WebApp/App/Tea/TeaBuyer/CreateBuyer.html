<form data-toggle="validator" role="form" ng-submit="save()">

    <div class="modal-header">
        <div>
            <h4>Buyer Information</h4>
        </div>
    </div>
    <div class="modal-body">
        <div id="container" style="padding: 25px">
            <div ng-show="message" class="{{messageclass}}" role="alert">
                <label>{{message}}</label>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <input type="text" ng-model="New.BuyerId" ng-hide="true" />
                <input type="text" ng-model="New.RowVersion" ng-hide="true" />

            </div>
            <div class="form-group">
                <label for="buyername">Buyer Code:</label>
                <input type="text" class="form-control" ng-model="New.BuyerCode" id="buyercode" style="width: 50%" required />

            </div>
            <div class="form-group">
                <label for="buyername">Buyer Name:</label>
                <input type="text" class="form-control" ng-model="New.BuyerName" id="buyername" required />

            </div>
            <div class="form-group">
                <label for="buyeraddress">Address:</label>
                <input type="text" class="form-control" ng-model="New.Address" id="buyeraddress" />
            </div>
            <div class="form-group">
                <label for="buyeraddress">Email:</label>
                <input type="text" class="form-control" ng-model="New.Email" id="buyeremail" />
            </div>
        </div>

    </div>
    <div class="modal-footer" style="text-align: right">
        <div class="form-group">
            <span style="margin-left: 8px;" ng-show="dataLoading">
                <img class="savedata"  />
            </span>
            <button type="submit" class="btn btn-primary btn-sm" ng-disabled="dataLoading">Save</button>
            <input type="button" class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="dataLoading" value="Cancel" />

        </div>
    </div>
</form>
