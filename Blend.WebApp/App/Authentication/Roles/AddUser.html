<div class="modal-header">
    <div>
        <h4>Add User to Role : {{SelectedRole}}</h4>
    </div>
</div>
<div class="modal-body">
    <div class="container-fluid">
        <div class="form-group">
            <input placeholder="Search User" style="width: 50%" id="searchadduser" type="text" class="form-control" ng-model="searchstr" id="txtSearch" ng-change="searchusers()" />
            <span style="margin-left: 8px;" ng-show="showLoader">
                <img class="savedata" />
            </span>
        </div>

        <table class="table-responsive" style="width: 100%" >
            <tr>
                <th>User Name</th>
                <th>Name</th>
                <th>Email</th>
                <th></th>

            </tr>
            <tr ng-repeat="c in userData">
                <td ng-hide="true">{{c.UserId}}</td>
                <td>{{c.UserName}}</td>
                <td>{{c.Name}}</td>
                <td>{{c.Email}}</td>

                <td>
                    <div class="btn-group">
                        <button class="btn btn-info btn-sm" ng-disabled="showLoader" ng-disabled="accessLevels.M" ng-click="save(c.UserId)">Add</button>
                    </div>
                </td>

            </tr>
        </table>
    </div>
</div>

<div class="modal-footer" style="text-align: right">
    <div class="form-group">
        <button class="btn btn-danger btn-sm" ng-click="cancel();" ng-disabled="button.disabled">Cancel</button>

    </div>
</div>
