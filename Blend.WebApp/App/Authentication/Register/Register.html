<form name="form" class="form-horizontal" role="form" ng-submit="registerUser()" style="width: 50%">
    <div>
        <h3>User Registration</h3>
    </div>
    <div class="container-fluid">

        <div>
            <div class="form-group">
                <label for="username">Username</label>
                <i class="fa fa-key"></i>
                <input type="text" name="username" id="username" class="form-control" ng-model="registerObj.username" required />
                <span ng-show="form.username.$dirty && form.username.$error.required" class="help-block">Username is required</span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <i class="fa fa-lock"></i>
                <input type="password" name="password" id="password" class="form-control" ng-model="registerObj.password" required />
                <span ng-show="form.password.$dirty && form.password.$error.required" class="help-block">Password is required</span>
            </div>
            <div class="form-group">
                <label for="repassword">Confirm Password</label>
                <i class="fa fa-lock"></i>
                <input type="password" name="password" id="repassword" class="form-control" ng-model="registerObj.repassword" required />
                <span ng-show="form.repassword.$dirty && form.repassword.$error.required" class="help-block">Password is required</span>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <i class="fa fa-lock"></i>
                <input type="email" name="email" id="email" class="form-control" ng-model="registerObj.email" required />
                <span ng-show="form.email.$dirty && form.email.$error.required" class="help-block">Email is required</span>
                <span ng-show="form.email.$error.email" class="error">Not a valid email!</span>
            </div>
            <div class="form-group">
                <label for="name">Name</label>
                <i class="fa fa-lock"></i>
                <input type="text" name="name" id="name" class="form-control" ng-model="registerObj.name" required />
                <span ng-show="form.name.$dirty && form.name.$error.required" class="help-block">Name is required</span>
            </div>
        </div>
        <div style="text-align: right">
            <span style="margin-left: 8px;" ng-show="dataLoading">
                <img class="savedata" />
            </span>
            <button id="Button1" type="submit" class="btn btn-primary btn-sm" ng-disabled="form.$invalid || showLoading"><i class="icon-hand-right"></i>Register</button>
        </div>
    </div>

</form>
