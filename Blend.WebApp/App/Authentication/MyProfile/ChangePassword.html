<form class="form-horizontal" role="form" ng-submit="changepassword()">
    <div class="modal-header">
        <div>
            <button type="button" class="close" data-dismiss="modal" ng-click="cancel()" aria-hidden="true">×</button>

            <h4>Change Password</h4>
        </div>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="col-md-4 control-label" for="piCurrPass">Old Password</label>
            <div class="col-md-4">
                <input id="piCurrPass" name="piCurrPass" type="password" placeholder="" class="form-control input-md" ng-blur="validatepassword()" ng-model="obj.OldPassword" required="">
            </div>
            <span style="margin-left: 8px; width: 40px; height: 40px" ng-show="dataLoading">
                <img class="savedata" />
            </span>
            <span style="margin-left: 8px; width: 40px; height: 40px" ng-show="statusIcon">
                <img ng-class="setclass" />
            </span>

        </div>

        <!-- Password input-->
        <div class="form-group">
            <label class="col-md-4 control-label" for="piNewPass">New Password</label>
            <div class="col-md-4">
                <input id="piNewPass" name="piNewPass" type="password" placeholder="" class="form-control input-md" ng-model="obj.NewPassword"
                    ng-change="validationInputPwdText(obj.NewPassword)" required="">
            </div>
            <span style="margin-left: 8px; width: 40px; height: 40px">
                <label ng-style="checkpwdStrength"></label>
                <!--<div ng-style="checkpwdStrength"></div>-->
            </span>

        </div>

        <!-- Password input-->
        <div class="form-group">
            <label class="col-md-4 control-label" for="piNewPassRepeat">Confirm Password</label>
            <div class="col-md-4">
                <input id="piNewPassRepeat" name="piNewPassRepeat" type="password" placeholder=""   class="form-control input-md" ng-model="obj.ConfPassword" required="">
            </div>
        </div>

        <!-- Button (Double) -->
        <div class="form-group">
            <label class="col-md-4 control-label" for="bCancel"></label>
            <div class="col-md-8">
                <button type="submit" id="bCancel" name="bCancel" class="btn btn-primary btn-sm" ng-disabled="disableSave">Submit</button>
                <input type="button" id="bGodkend" name="bGodkend" ng-click="cancel()" class="btn btn-danger btn-sm" value="Cancel" />
                <span style="margin-left: 8px; width: 40px; height: 40px" ng-show="dataSaving">
                    <img class="savedata" />
                </span>
            </div>
        </div>
    </div>
</form>
